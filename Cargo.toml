[package]
name = "hyprclick"
version = "0.4.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# On Windows the Lag tab runs lagswitch's logic in-process, over WinDivert.
[target.'cfg(windows)'.dependencies]
lagswitch = { path = "lagswitch" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
